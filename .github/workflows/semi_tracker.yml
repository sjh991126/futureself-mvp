name: semi-cycle-tracker

on:
  schedule:
    # 평일 08:10 KST (= 전날 23:10 UTC): 장 시작 전 전일 수급·환율·현물가 반영
    - cron: "10 23 * * 0-4"
  workflow_dispatch:
    inputs:
      only:
        description: "실행할 소스 키 (쉼표 구분, 비우면 전체)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: semi-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: semi_tracker/requirements.txt

      - name: Install
        run: pip install -r semi_tracker/requirements.txt

      - name: Run tracker
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TRACKER_CONTACT_EMAIL: ${{ secrets.TRACKER_CONTACT_EMAIL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python -m semi_tracker.run --only "${{ github.event.inputs.only }}"
          else
            python -m semi_tracker.run
          fi

      - name: Show report
        run: cat data/reports/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit data
        run: |
          git config user.name "semi-tracker-bot"
          git config user.email "semi-tracker-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "tracker: $(date -u +'%Y-%m-%d') 지표 갱신"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
